; Settings for running the game from this computer. Lines starting with ; are notes.
[party]

; Where your pictures, sounds and clips are. A network drive is fine, as a drive letter or a \\server\share path.
; Leave it blank to use the assets\media folder inside the game folder.
; Example:  media_folder = Z:\Trivia Media
media_folder =

; The local port. Only change it if something else on this computer already uses 8080.
port = 8080

; yes = make a public address so phones on any network can join. no = this computer only.
tunnel = yes

; yes = open the big screen in your browser when the party starts.
open_browser = yes
